    <g transform="rotate(10 244 78)"><rect x="209" y="12" width="70" height="103" rx="8" fill="#fff" stroke="#e5b641" stroke-width="4"/><text x="244" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="47" font-weight="800" fill="#25476e">B</text><path d="M223 27h42" stroke="#e5b641" stroke-width="3" stroke-linecap="round"/></g>
    <g transform="rotate(-3 166 72)"><rect x="134" y="5" width="64" height="94" rx="7" fill="#f4fbff" stroke="#18395f" stroke-width="3"/><rect x="140" y="11" width="52" height="82" rx="5" fill="url(#back)"/><path d="M149 53c0-16 20-24 33-14 13 10 6 29-9 31-9 2-17-4-17-13 0-7 6-12 13-11 5 1 8 5 8 9" fill="none" stroke="#e0f5ff" stroke-width="4" stroke-linecap="round"/></g>
