<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">BinderBase — Collector Badge</title>
  <desc id="desc">A round badge with a zipped binder and four cards, two marked B and two showing blue swirls.</desc>
  <defs><linearGradient id="cover" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#315987"/><stop offset="1" stop-color="#142d4b"/></linearGradient><linearGradient id="blue" x1="0" x2="1"><stop stop-color="#56b9ed"/><stop offset="1" stop-color="#154c86"/></linearGradient></defs>
  <circle cx="160" cy="160" r="149" fill="#f6f9fc" stroke="#19375c" stroke-width="10"/>
  <circle cx="160" cy="160" r="135" fill="none" stroke="#dfb142" stroke-width="3"/>
  <!-- cards: exactly two B fronts, two patterned backs -->
  <g transform="rotate(-13 107 105)"><rect x="73" y="46" width="64" height="94" rx="8" fill="#fff" stroke="#dfb142" stroke-width="4"/><text x="105" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="44" font-weight="800" fill="#24476f">B</text></g>
  <g transform="rotate(13 213 105)"><rect x="183" y="46" width="64" height="94" rx="8" fill="#fff" stroke="#dfb142" stroke-width="4"/><text x="215" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="44" font-weight="800" fill="#24476f">B</text></g>
  <g transform="rotate(-6 147 91)"><rect x="119" y="33" width="56" height="82" rx="7" fill="#fff" stroke="#19375c" stroke-width="3"/><rect x="124" y="38" width="46" height="72" rx="5" fill="url(#blue)"/><path d="M132 74c0-14 17-21 28-12 11 9 5 25-8 27-8 2-14-4-14-11 0-6 5-10 11-9 4 1 7 4 6 8" fill="none" stroke="#def4ff" stroke-width="4" stroke-linecap="round"/></g>
  <g transform="rotate(6 173 90)"><rect x="145" y="32" width="56" height="82" rx="7" fill="#fff" stroke="#19375c" stroke-width="3"/><rect x="150" y="37" width="46" height="72" rx="5" fill="url(#blue)"/><path d="M158 73c0-14 17-21 28-12 11 9 5 25-8 27-8 2-14-4-14-11 0-6 5-10 11-9 4 1 7 4 6 8" fill="none" stroke="#def4ff" stroke-width="4" stroke-linecap="round"/></g>
  <!-- zip binder -->
  <path d="M74 117q0-9 10-9h152q10 0 10 10v82q0 11-11 11H85q-11 0-11-11Z" fill="url(#cover)" stroke="#0d1e34" stroke-width="4"/>
  <path d="M91 119v82M229 119v82" stroke="#91a7be" stroke-width="2" opacity=".7"/>
  <path d="M82 115v96" stroke="#e3b13e" stroke-width="3" stroke-dasharray="3 4"/>
  <path d="M80 156H70q-7 0-7 7t7 7h10" fill="none" stroke="#e3b13e" stroke-width="4" stroke-linecap="round"/>
  <rect x="217" y="144" width="14" height="34" rx="6" fill="#dfaa35" stroke="#fff0c2" stroke-width="2"/>
  <text x="160" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="800" letter-spacing="-.8" fill="#19375c">Binder<tspan fill="#d5a636">Base</tspan></text>
</svg>
